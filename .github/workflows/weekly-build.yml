name: Weekly Build

# Safety net independent of commits: catches drift caused by things that
# change without a code change (breaking dependency bump, base image
# update, etc.) on develop.
on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch: {} # allows manual trigger from the Actions tab

jobs:
  full-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout develop
      uses: actions/checkout@v4
      with:
        ref: develop

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    - name: Full build + unit and integration tests
      run: mvn clean install -P integration-tests

    - name: List outdated dependencies
      run: mvn versions:display-dependency-updates
