spring.application.name=p2p
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Never expose stack traces or exception messages via /error, regardless of profile. Explicit here
# rather than relying on spring-boot-devtools being absent from the packaged prod jar (which it is,
# by default) - this is a second, independent guard against that class of information disclosure.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# Logging
logging.level.root=INFO
logging.level.com.finovago.p2p=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n

#swagger doc
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.urls-primary-name=customer-api
springdoc.swagger-ui.urls[0].name=customer-api
springdoc.swagger-ui.urls[0].url=/api-docs/customer-api
springdoc.swagger-ui.urls[1].name=admin-api
springdoc.swagger-ui.urls[1].url=/api-docs/admin-api
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Gift card holds (reserve/capture/release)
app.holds.ttl-minutes=15
app.holds.expiration-sweep-interval-ms=60000

# Idempotency keys (redeem)
app.idempotency.ttl-hours=24
app.idempotency.cleanup-sweep-interval-ms=3600000

# Refresh tokens
app.refresh-token.cleanup-sweep-interval-ms=3600000

# Ledger reconciliation (detects drift between gift_card.balance and its ledger)
app.ledger.reconciliation-interval-ms=300000

# Ledger partition runway monitor (see V21 migration) - read-only, weekly by default
app.ledger.partition-monitor-interval-ms=604800000
