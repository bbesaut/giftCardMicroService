# Logging - Production
logging.level.root=WARN
logging.level.com.finovago.p2p=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.context.request.async=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.boot.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.io.jsonwebtoken=WARN

logging.file.name=logs/p2p.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [correlationId=%X{correlationId}] - %msg%n

# Connection Pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# DB_USERNAME/DB_PASSWORD stay the schema-owner role: only used to run Flyway migrations.
# The running application connects as APP_DB_USERNAME/APP_DB_PASSWORD instead, a least-privilege
# role with no owner bypass - see V17__restrict_app_role_privileges.sql (e.g. no UPDATE/DELETE on
# gift_card_ledger, so a code bug can't corrupt the append-only ledger history).
spring.flyway.url=${DB_URL}
spring.flyway.user=${DB_USERNAME}
spring.flyway.password=${DB_PASSWORD}

spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${APP_DB_USERNAME}
spring.datasource.password=${APP_DB_PASSWORD}

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION}
application.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - prod DB already has data; baseline it at V1 instead of trying to (re)create existing tables
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Swagger/OpenAPI disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

loki.username=${GRAFANA_LOKI_USER}
loki.password=${GRAFANA_LOKI_TOKEN}

# Keep-alive: pings our own public URL every 12 min so Render's free tier doesn't spin the
# instance down after 15 min of inbound-traffic silence. RENDER_EXTERNAL_URL is set automatically
# by Render - only app.keep-alive.enabled needs to be turned on here.
app.keep-alive.enabled=true
app.keep-alive.interval-ms=720000

# Mail (password reset) - Brevo SMTP relay. MAIL_USERNAME/MAIL_PASSWORD are the SMTP login/key
# from Brevo's SMTP & API settings (not the account password). MAIL_FROM must be a sender address
# verified in Brevo.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}

