# Logging
logging.level.root=INFO
logging.level.com.finovago.p2p=DEBUG
logging.level.org.springframework.web=DEBUG

spring.output.ansi.enabled=ALWAYS
# Console pattern (including scheduler-specific format) lives in logback-spring.xml for this profile.

# Database - PostgreSQL running locally via docker-compose (see docker-compose.yml)
# p2p owns the schema and is only used to run migrations (Flyway). The app itself connects as
# p2p_app, a least-privilege role with no owner bypass - see V17__restrict_app_role_privileges.sql.
spring.flyway.url=jdbc:postgresql://localhost:5432/p2p_dev
spring.flyway.user=p2p
spring.flyway.password=p2p

spring.datasource.url=jdbc:postgresql://localhost:5432/p2p_dev
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=p2p_app
spring.datasource.password=p2p_app
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

loki4j.enabled=false

# Server
server.port=8080

#swagger doc
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

application.security.jwt.secret-key=${JWT_SECRET_KEY:secret_key_for_dev_environment_that_is_longer_than_32_characters}
application.security.jwt.access-token-expiration=${JWT_ACCESS_EXPIRATION:900000}
application.security.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Mail (password reset) - Brevo SMTP relay, free tier (300 emails/day, no card required).
# MAIL_USERNAME/MAIL_PASSWORD are the SMTP login/key from Brevo's SMTP & API settings (not your
# account password). MAIL_FROM must be a sender address verified in Brevo - see CLAUDE.md.
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@finovago.local}